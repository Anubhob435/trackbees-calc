<!DOCTYPE html>
<html data-theme="dark">
<head>
    <title>Graphing Calculator</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logo-icon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">        <div class="sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Trackbeez Logo" style="max-width: 150px; height: auto; margin-bottom: 1rem;">
                <h2><i class="fas fa-calculator"></i> Calculator Suite</h2>
            </div>            <div class="nav-buttons">
                <a href="{{ url_for('home') }}" class="nav-btn" data-title="Home">
                    <i class="fas fa-home"></i>
                    <span class="nav-text">Home</span>
                    <span class="nav-description">Back to main menu</span>
                </a>
                <a href="{{ url_for('calculator') }}" class="nav-btn">
                    <i class="fas fa-calculator"></i>
                    <span class="nav-text">Scientific</span>
                    <span class="nav-description">Complex calculations</span>
                </a>
                <a href="{{ url_for('graphing') }}" class="nav-btn active">
                    <i class="fas fa-chart-line"></i>
                    <span class="nav-text">Graphing</span>
                    <span class="nav-description">Plot mathematical functions</span>
                </a>
                <a href="{{ url_for('matrix') }}" class="nav-btn">
                    <i class="fas fa-table"></i>
                    <span class="nav-text">Matrix</span>
                    <span class="nav-description">Matrix operations</span>
                </a>
                <a href="{{ url_for('draw') }}" class="nav-btn">
                    <i class="fas fa-pencil-alt"></i>
                    <span class="nav-text">Draw</span>
                    <span class="nav-description">AI-powered calculations</span>
                </a>
                <a href="{{ url_for('converter') }}" class="nav-btn">
                    <i class="fas fa-exchange-alt"></i>
                    <span class="nav-text">Converter</span>
                    <span class="nav-description">Unit conversions</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <button id="themeToggle" class="theme-btn">
                    <i class="fas fa-moon"></i>
                    <span>Dark Mode</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="graph-tabs">
                <button class="graph-tab active" onclick="switchTab('function')">
                    <i class="fas fa-chart-line"></i> Function Plot
                </button>
                <button class="graph-tab" onclick="switchTab('love')">
                    <i class="fas fa-heart"></i> Love Graph
                </button>
            </div>

            <div id="functionPlot" class="graph-section">
                <div class="graph-controls">
                    <div class="input-group">
                        <input type="text" id="function" class="form-input" placeholder="Enter function (e.g., x^2, sin(x))">
                        <div class="function-buttons">
                            <button onclick="insertMathSymbol('sin(x)')">sin</button>
                            <button onclick="insertMathSymbol('cos(x)')">cos</button>
                            <button onclick="insertMathSymbol('tan(x)')">tan</button>
                            <button onclick="insertMathSymbol('sqrt(x)')">√</button>
                            <button onclick="insertMathSymbol('x^2')">x²</button>
                        </div>
                    </div>
                    <div class="range-controls">
                        <div class="range-group">
                            <label>X Range:</label>
                            <input type="number" id="xMin" value="-10" step="1"> to
                            <input type="number" id="xMax" value="10" step="1">
                        </div>
                        <div class="range-group">
                            <label>Y Range:</label>
                            <input type="number" id="yMin" value="-10" step="1"> to
                            <input type="number" id="yMax" value="10" step="1">
                        </div>
                    </div>
                    <button id="plotBtn" class="btn primary" onclick="plotFunction()">
                        <i class="fas fa-play"></i> Plot Function
                    </button>
                </div>
                <div class="graph-container">
                    <div id="graph"></div>
                </div>
            </div>

            <div id="loveGraph" class="graph-section" style="display: none;">
                <div class="graph-controls">
                    <button id="animateBtn" class="btn primary" onclick="plotLoveGraph()">
                        <i class="fas fa-heart"></i> Animate Love Graph
                    </button>
                </div>
                <div class="graph-container">
                    <div id="loveGraphPlot"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/graphing.js') }}"></script>
</body>
</html>
