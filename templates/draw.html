<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Drawing Board — Trackbeez</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logo-icon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Trackbeez Logo">
                <h2><i class="fas fa-calculator"></i> Calculator Suite</h2>
            </div>
            <div class="nav-buttons">
                <a href="{{ url_for('home') }}" class="nav-btn" data-title="Home">
                    <i class="fas fa-home"></i>
                    <span class="nav-text">Home</span>
                </a>
                <a href="{{ url_for('calculator') }}" class="nav-btn" data-title="Scientific Calculator">
                    <i class="fas fa-calculator"></i>
                    <span class="nav-text">Scientific</span>
                </a>
                <a href="{{ url_for('graphing') }}" class="nav-btn" data-title="Graphing Calculator">
                    <i class="fas fa-chart-line"></i>
                    <span class="nav-text">Graphing</span>
                </a>
                <a href="{{ url_for('matrix') }}" class="nav-btn" data-title="Matrix Calculator">
                    <i class="fas fa-table"></i>
                    <span class="nav-text">Matrix</span>
                </a>
                <a href="{{ url_for('draw') }}" class="nav-btn active" data-title="AI Drawing Calculator">
                    <i class="fas fa-pencil-alt"></i>
                    <span class="nav-text">Draw</span>
                </a>
                <a href="{{ url_for('converter') }}" class="nav-btn" data-title="Unit Converter">
                    <i class="fas fa-exchange-alt"></i>
                    <span class="nav-text">Converter</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <button id="themeToggle" class="theme-btn">
                    <i class="fas fa-moon"></i>
                    <span>Dark Mode</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="tools">
                <div class="tool-group">
                    <label for="colorPicker" class="tool-label">Color</label>
                    <input type="color" id="colorPicker" value="#000000">
                </div>
                <div class="tool-group">
                    <label for="brushSize" class="tool-label">Brush Size</label>
                    <input type="range" id="brushSize" min="1" max="50" value="5">
                    <span id="brushSizeValue">5px</span>
                </div>
                <div class="tool-group button-group">
                    <button id="themeBtn" class="btn theme"><i class="fas fa-moon"></i> Theme</button>
                    <button id="clearBtn" class="btn"><i class="fas fa-trash"></i> Clear</button>
                    <button id="saveBtn" class="btn primary"><i class="fas fa-save"></i> Save</button>
                    <button id="aiBtn" class="btn ai"><i class="fas fa-brain"></i> AI Calculate</button>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="drawingCanvas"></canvas>
            </div>
            <div id="aiResultBox" class="ai-result-box hidden">
                <div class="ai-result-header">
                    <h3><i class="fas fa-robot"></i> AI Calculation Result</h3>
                    <button id="closeAiResult" class="btn-close"><i class="fas fa-times"></i></button>
                </div>
                <div id="aiResultContent" class="ai-result-content"></div>
            </div>
        </div>
        <div class="preview-panel">
            <h3>Saved Drawings</h3>
            <div id="drawings-container"></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                const icon = toggle.querySelector('i');
                const label = toggle.querySelector('span');
                if (theme === 'dark') { icon.className = 'fas fa-sun'; label.textContent = 'Light Mode'; }
                toggle.addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                    icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                    label.textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
                });
            }
            const mobileToggle = document.getElementById('mobileToggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (mobileToggle) {
                mobileToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('open');
                    overlay.classList.toggle('active');
                });
                overlay.addEventListener('click', () => {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                });
            }
        })();
    </script>
</body>
</html>
