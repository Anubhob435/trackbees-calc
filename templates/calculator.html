<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator — Trackbeez</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logo-icon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Mobile hamburger toggle -->
    <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Trackbeez Logo">
                <h2><i class="fas fa-calculator"></i> Calculator Suite</h2>
            </div>
            <div class="nav-buttons">
                <a href="{{ url_for('home') }}" class="nav-btn" data-title="Home">
                    <i class="fas fa-home"></i>
                    <span class="nav-text">Home</span>
                </a>
                <a href="{{ url_for('calculator') }}" class="nav-btn active" data-title="Scientific Calculator">
                    <i class="fas fa-calculator"></i>
                    <span class="nav-text">Scientific</span>
                </a>
                <a href="{{ url_for('graphing') }}" class="nav-btn" data-title="Graphing Calculator">
                    <i class="fas fa-chart-line"></i>
                    <span class="nav-text">Graphing</span>
                </a>
                <a href="{{ url_for('matrix') }}" class="nav-btn" data-title="Matrix Calculator">
                    <i class="fas fa-table"></i>
                    <span class="nav-text">Matrix</span>
                </a>
                <a href="{{ url_for('draw') }}" class="nav-btn" data-title="AI Drawing Calculator">
                    <i class="fas fa-pencil-alt"></i>
                    <span class="nav-text">Draw</span>
                </a>
                <a href="{{ url_for('converter') }}" class="nav-btn" data-title="Unit Converter">
                    <i class="fas fa-exchange-alt"></i>
                    <span class="nav-text">Converter</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <button id="themeToggle" class="theme-btn">
                    <i class="fas fa-moon"></i>
                    <span>Dark Mode</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="calculator-display">
                <input type="text" id="display" class="calc-display" readonly placeholder="0">
            </div>
            
            <div class="calculator-pad">
                <div class="function-buttons">
                    <button onclick="appendToDisplay('Math.sin(')" class="btn">sin</button>
                    <button onclick="appendToDisplay('Math.cos(')" class="btn">cos</button>
                    <button onclick="appendToDisplay('Math.tan(')" class="btn">tan</button>
                    <button onclick="appendToDisplay('Math.log10(')" class="btn">log</button>
                    <button onclick="appendToDisplay('Math.log(')" class="btn">ln</button>
                </div>
                
                <div class="number-pad">
                    <button onclick="appendToDisplay('7')" class="btn">7</button>
                    <button onclick="appendToDisplay('8')" class="btn">8</button>
                    <button onclick="appendToDisplay('9')" class="btn">9</button>
                    <button onclick="appendToDisplay('/')" class="btn">/</button>
                    
                    <button onclick="appendToDisplay('4')" class="btn">4</button>
                    <button onclick="appendToDisplay('5')" class="btn">5</button>
                    <button onclick="appendToDisplay('6')" class="btn">6</button>
                    <button onclick="appendToDisplay('*')" class="btn">×</button>
                    
                    <button onclick="appendToDisplay('1')" class="btn">1</button>
                    <button onclick="appendToDisplay('2')" class="btn">2</button>
                    <button onclick="appendToDisplay('3')" class="btn">3</button>
                    <button onclick="appendToDisplay('-')" class="btn">-</button>
                    
                    <button onclick="appendToDisplay('0')" class="btn">0</button>
                    <button onclick="appendToDisplay('.')" class="btn">.</button>
                    <button onclick="clearDisplay()" class="btn danger">C</button>
                    <button onclick="appendToDisplay('+')" class="btn">+</button>
                </div>
                
                <button onclick="calculate()" class="btn primary equals">=</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
    <script>
        // Theme & mobile nav
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                const icon = toggle.querySelector('i');
                const label = toggle.querySelector('span');
                if (theme === 'dark') { icon.className = 'fas fa-sun'; label.textContent = 'Light Mode'; }
                toggle.addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                    icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                    label.textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
                });
            }
            const mobileToggle = document.getElementById('mobileToggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (mobileToggle) {
                mobileToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('open');
                    overlay.classList.toggle('active');
                });
                overlay.addEventListener('click', () => {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                });
            }
        })();
    </script>
</body>
</html>
