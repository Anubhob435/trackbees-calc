<!DOCTYPE html>
<html data-theme="dark">
<head>
    <title>Scientific Calculator</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logo-icon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">        <div class="sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Trackbeez Logo" style="max-width: 150px; height: auto; margin-bottom: 1rem;">
                <h2><i class="fas fa-calculator"></i> Calculator Suite</h2>
            </div>            <div class="nav-buttons">
                <a href="{{ url_for('home') }}" class="nav-btn" data-title="Home">
                    <i class="fas fa-home"></i>
                    <span class="nav-text">Home</span>
                    <span class="nav-description">Back to main menu</span>
                </a>
                <a href="{{ url_for('calculator') }}" class="nav-btn active" data-title="Scientific Calculator">
                    <i class="fas fa-calculator"></i>
                    <span class="nav-text">Scientific</span>
                    <span class="nav-description">Complex calculations</span>
                </a>
                <a href="{{ url_for('graphing') }}" class="nav-btn" data-title="Graphing Calculator">
                    <i class="fas fa-chart-line"></i>
                    <span class="nav-text">Graphing</span>
                    <span class="nav-description">Plot mathematical functions</span>
                </a>
                <a href="{{ url_for('matrix') }}" class="nav-btn" data-title="Matrix Calculator">
                    <i class="fas fa-table"></i>
                    <span class="nav-text">Matrix</span>
                    <span class="nav-description">Matrix operations</span>
                </a>
                <a href="{{ url_for('draw') }}" class="nav-btn" data-title="AI Drawing Calculator">
                    <i class="fas fa-pencil-alt"></i>
                    <span class="nav-text">Draw</span>
                    <span class="nav-description">AI-powered calculations</span>
                </a>
                <a href="{{ url_for('converter') }}" class="nav-btn" data-title="Unit Converter">
                    <i class="fas fa-exchange-alt"></i>
                    <span class="nav-text">Converter</span>
                    <span class="nav-description">Unit conversions</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <button id="themeToggle" class="theme-btn">
                    <i class="fas fa-moon"></i>
                    <span>Dark Mode</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="calculator-display">
                <input type="text" id="display" class="calc-display" readonly>
            </div>
            
            <div class="calculator-pad">
                <div class="function-buttons">
                    <button onclick="appendToDisplay('Math.sin(')" class="btn">sin</button>
                    <button onclick="appendToDisplay('Math.cos(')" class="btn">cos</button>
                    <button onclick="appendToDisplay('Math.tan(')" class="btn">tan</button>
                    <button onclick="appendToDisplay('Math.log10(')" class="btn">log</button>
                    <button onclick="appendToDisplay('Math.log(')" class="btn">ln</button>
                </div>
                
                <div class="number-pad">
                    <button onclick="appendToDisplay('7')" class="btn">7</button>
                    <button onclick="appendToDisplay('8')" class="btn">8</button>
                    <button onclick="appendToDisplay('9')" class="btn">9</button>
                    <button onclick="appendToDisplay('/')" class="btn">/</button>
                    
                    <button onclick="appendToDisplay('4')" class="btn">4</button>
                    <button onclick="appendToDisplay('5')" class="btn">5</button>
                    <button onclick="appendToDisplay('6')" class="btn">6</button>
                    <button onclick="appendToDisplay('*')" class="btn">×</button>
                    
                    <button onclick="appendToDisplay('1')" class="btn">1</button>
                    <button onclick="appendToDisplay('2')" class="btn">2</button>
                    <button onclick="appendToDisplay('3')" class="btn">3</button>
                    <button onclick="appendToDisplay('-')" class="btn">-</button>
                    
                    <button onclick="appendToDisplay('0')" class="btn">0</button>
                    <button onclick="appendToDisplay('.')" class="btn">.</button>
                    <button onclick="clearDisplay()" class="btn danger">C</button>
                    <button onclick="appendToDisplay('+')" class="btn">+</button>
                </div>
                
                <button onclick="calculate()" class="btn primary equals">=</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>
