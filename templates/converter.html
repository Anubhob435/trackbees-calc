<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter — Trackbeez</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logo-icon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Trackbeez Logo">
                <h2><i class="fas fa-calculator"></i> Calculator Suite</h2>
            </div>
            <div class="nav-buttons">
                <a href="{{ url_for('home') }}" class="nav-btn" data-title="Home">
                    <i class="fas fa-home"></i>
                    <span class="nav-text">Home</span>
                </a>
                <a href="{{ url_for('calculator') }}" class="nav-btn" data-title="Scientific Calculator">
                    <i class="fas fa-calculator"></i>
                    <span class="nav-text">Scientific</span>
                </a>
                <a href="{{ url_for('graphing') }}" class="nav-btn" data-title="Graphing Calculator">
                    <i class="fas fa-chart-line"></i>
                    <span class="nav-text">Graphing</span>
                </a>
                <a href="{{ url_for('matrix') }}" class="nav-btn" data-title="Matrix Calculator">
                    <i class="fas fa-table"></i>
                    <span class="nav-text">Matrix</span>
                </a>
                <a href="{{ url_for('draw') }}" class="nav-btn" data-title="AI Drawing Calculator">
                    <i class="fas fa-pencil-alt"></i>
                    <span class="nav-text">Draw</span>
                </a>
                <a href="{{ url_for('converter') }}" class="nav-btn active" data-title="Unit Converter">
                    <i class="fas fa-exchange-alt"></i>
                    <span class="nav-text">Converter</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <button id="themeToggle" class="theme-btn">
                    <i class="fas fa-moon"></i>
                    <span>Dark Mode</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="converter-container">
                <div class="converter-tabs">
                    <button class="converter-tab active" data-type="Length">
                        <i class="fas fa-ruler"></i> Length
                    </button>
                    <button class="converter-tab" data-type="Weight">
                        <i class="fas fa-weight-hanging"></i> Weight
                    </button>
                    <button class="converter-tab" data-type="Temperature">
                        <i class="fas fa-thermometer-half"></i> Temperature
                    </button>
                </div>

                <div class="converter-input-group">
                    <div class="input-section">
                        <input type="number" id="inputValue" class="converter-input" placeholder="Enter value">
                        <span id="inputUnit" class="unit-label">meters</span>
                    </div>
                    <div class="converter-arrow">
                        <i class="fas fa-exchange-alt"></i>
                    </div>
                    <div class="output-section">
                        <input type="text" id="outputValue" class="converter-input" readonly>
                        <span id="outputUnit" class="unit-label">feet</span>
                    </div>
                </div>

                <button id="convertBtn" class="btn primary convert-btn">
                    <i class="fas fa-sync-alt"></i> Convert
                </button>

                <div class="conversion-history">
                    <h3><i class="fas fa-history"></i> Recent Conversions</h3>
                    <div id="historyList"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/converter.js') }}"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                const icon = toggle.querySelector('i');
                const label = toggle.querySelector('span');
                if (theme === 'dark') { icon.className = 'fas fa-sun'; label.textContent = 'Light Mode'; }
                toggle.addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                    icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                    label.textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
                });
            }
            const mobileToggle = document.getElementById('mobileToggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (mobileToggle) {
                mobileToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('open');
                    overlay.classList.toggle('active');
                });
                overlay.addEventListener('click', () => {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                });
            }
        })();
    </script>
</body>
</html>
